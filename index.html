<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uncountable: The AI Platform for End-to-End Product Development</title>

  <!-- Fonts: Poppins (brand) + Material Symbols Rounded (iconography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  />

  <style>
    /* ======================================================
       Uncountable Design System — foundation tokens
       Palette v2 (post-rebrand). See JS constants below for
       semantic role mapping. WCAG ratings against intended
       surface (white or midnight) — all foreground roles
       pass AA or higher; tints and decorative backgrounds
       are dark-surface-only.
       ====================================================== */
    :root {
      /* Primary */
      --uc-white:        #FFFFFF;            /* bg fill */
      --uc-midnight:     #020D4C;            /* bg fill (dark) */
      --uc-royal-blue:   #01318F;            /* logo / headlines  AAA on white */

      /* Secondary */
      --uc-mist:         #EAF2F9;            /* bg fill (cool light) */
      --uc-fog:          #DFE3EA;            /* bg fill (neutral light) */
      --uc-azure:        #046CDE;            /* primary CTA / buttons  AA on white */

      /* Extended */
      --uc-sky-cyan:     #00C7FE;            /* secondary CTA on dark  AAA on midnight */
      --uc-emerald:      #018744;            /* extended accent  AA on white */
      --uc-amber:        #FFAF0F;            /* extended accent — DARK-SURFACE ONLY */
      --uc-slate:        #3C4554;            /* paragraph text  AAA on white */

      /* Tints — limited use for gradients and decorative backgrounds */
      --uc-tint-sky:     #80E3FE;
      --uc-tint-mint:    #80D4AA;
      --uc-tint-ice:     #BFF1FF;
      --uc-tint-seafoam: #BFE9D4;

      /* Functional / status (outside brand palette — kept for in-product UI) */
      --uc-status-red:        #E53935;
      --uc-status-red-bg:     #FDECEA;
      --uc-status-green-bg:   #E8F5E9;

      /* Type */
      --uc-font-sans: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--uc-font-sans);
      color: var(--uc-slate);
      background: #fff;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Material Symbols base sizing is controlled by inline font-size */
    .material-symbols-rounded {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }

    button { font-family: inherit; }
    input { font-family: inherit; }

    /* ======================================================
       Animations — minimal, brand-appropriate
       Uncountable brand rule: short fades (120–200ms base,
       up to 500ms for entrances), ease-out, no springs.
       ====================================================== */
    @keyframes uc-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes uc-fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes uc-fade-down {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes uc-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Above-the-fold entrance — plays on mount with cubic ease-out */
    .uc-enter     { animation: uc-fade-up 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    .uc-enter-nav { animation: uc-fade-down 700ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    .uc-enter-d0  { animation-delay:    0ms; }
    .uc-enter-d1  { animation-delay:  140ms; }
    .uc-enter-d2  { animation-delay:  280ms; }
    .uc-enter-d3  { animation-delay:  420ms; }
    .uc-enter-d4  { animation-delay:  560ms; }
    .uc-enter-d5  { animation-delay:  720ms; }
    .uc-enter-d6  { animation-delay:  900ms; }
    .uc-enter-d7  { animation-delay: 1080ms; }

    /* Below-the-fold reveal — driven by IntersectionObserver adding .is-visible */
    .uc-reveal {
      opacity: 0;
      transform: translateY(14px);
      transition:
        opacity 900ms cubic-bezier(0.22, 0.61, 0.36, 1),
        transform 900ms cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: opacity, transform;
    }
    .uc-reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Stagger container — children animate in sequence when the parent becomes visible */
    .uc-stagger > * {
      opacity: 0;
      transform: translateY(12px);
      transition:
        opacity 800ms cubic-bezier(0.22, 0.61, 0.36, 1),
        transform 800ms cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: opacity, transform;
    }
    .uc-stagger.is-visible > * { opacity: 1; transform: translateY(0); }
    .uc-stagger.is-visible > *:nth-child(1) { transition-delay:   0ms; }
    .uc-stagger.is-visible > *:nth-child(2) { transition-delay: 120ms; }
    .uc-stagger.is-visible > *:nth-child(3) { transition-delay: 240ms; }
    .uc-stagger.is-visible > *:nth-child(4) { transition-delay: 360ms; }
    .uc-stagger.is-visible > *:nth-child(5) { transition-delay: 480ms; }
    .uc-stagger.is-visible > *:nth-child(6) { transition-delay: 600ms; }

    /* Respect user preference — no motion if requested */
    @media (prefers-reduced-motion: reduce) {
      .uc-enter, .uc-enter-nav,
      .uc-reveal, .uc-reveal.is-visible,
      .uc-stagger > *, .uc-stagger.is-visible > * {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    /* Marketing: hover transitions */
    .uc-feature-card {
      transition: box-shadow 150ms ease, border-color 150ms ease, transform 150ms ease;
    }
    .uc-feature-card:hover {
      box-shadow: 0 10px 24px -10px rgba(2, 13, 76, 0.18);
      border-color: rgba(60, 69, 84, 0.2);
    }
    .uc-nav-link {
      transition: opacity 120ms ease;
    }
    .uc-nav-link:hover { opacity: 0.65; }

    .uc-cta-primary {
      transition: background 120ms ease, transform 80ms ease;
    }
    .uc-cta-primary:hover { opacity: 0.92; }
    .uc-cta-primary:active { transform: translateY(1px); }

    .uc-cta-ghost {
      transition: background 120ms ease, border-color 120ms ease;
    }
    .uc-cta-ghost:hover { background: rgba(255, 255, 255, 0.08); }

    .uc-resource-card {
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .uc-resource-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -12px rgba(2, 13, 76, 0.22);
    }

    /* Scrollbar styling inside platform panels */
    .uc-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .uc-scroll::-webkit-scrollbar-track { background: transparent; }
    .uc-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 999px; }
    .uc-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.22); }

    /* ======================================================
       Landing v2 — responsive collapse rules
       Inline-style grids on the new sections need !important
       to override at narrow viewports.
       ====================================================== */

    /* Tablet and below: deep-dive sidebar nav stacks above the rows.
       The rail + sliding dot is desktop-only — at narrow widths the nav
       falls back to a wrapped row of chip-style pills. */
    @media (max-width: 1024px) {
      .uc-deepdive {
        grid-template-columns: 1fr !important;
        gap: 32px !important;
      }
      .uc-deepdive > * { min-width: 0; }
      .uc-deepdive-nav {
        position: static !important;
        top: auto !important;
      }
      .uc-deepdive-rail,
      .uc-deepdive-dot {
        display: none !important;
      }
      .uc-deepdive-rail-eyebrow {
        padding-left: 0 !important;
      }
      .uc-deepdive-nav nav {
        flex-direction: row !important;
        flex-wrap: wrap !important;
        gap: 6px !important;
        padding-left: 0 !important;
      }
      .uc-deepdive-nav nav a {
        padding: 8px 14px !important;
        border-radius: 999px !important;
        background: transparent !important;
      }
      .uc-deepdive-nav nav a[data-active="true"] {
        background: #EAF2F9 !important;
        color: #01318F !important;
      }
      .uc-deepdive-row { min-width: 0; }
    }

    /* Mobile: deep-dive rows stack with screen first, all 2-col layouts collapse */
    @media (max-width: 768px) {
      .uc-deepdive-row > .uc-reveal,
      .uc-deepdive-row > .uc-stagger {
        grid-template-columns: 1fr !important;
        gap: 24px !important;
      }
      .uc-deepdive-row .uc-deepdive-copy { order: 2; min-width: 0; }
      .uc-deepdive-row .uc-deepdive-screen { order: 1; min-width: 0; max-width: 100%; overflow: hidden; }

      .uc-outcomes-grid {
        grid-template-columns: 1fr !important;
        gap: 32px !important;
      }
      .uc-outcomes-header {
        position: static !important;
        top: auto !important;
      }

      .uc-voices-grid {
        grid-template-columns: 1fr !important;
      }
    }

    /* Tablet narrow: customer voices collapse from 3 to 2 columns */
    @media (min-width: 769px) and (max-width: 1024px) {
      .uc-voices-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }

    /* Logo strip stats: drop the vertical pipe dividers when stats wrap */
    @media (max-width: 640px) {
      .uc-stat-divider { display: none !important; }
    }

    /* Demo modal: collapse the 2-column field grid to a single stack at narrow widths */
    @media (max-width: 520px) {
      .uc-demo-grid { grid-template-columns: 1fr !important; }
    }

    /* Nav: hide the middle anchor links and the divider pipe on tablet and
       narrower so the bar stays just logo + Request a Demo CTA. Tighten
       chrome at small mobile widths so the CTA still fits cleanly. */
    @media (max-width: 900px) {
      .uc-nav-mid,
      .uc-nav-divider {
        display: none !important;
      }
    }
    @media (max-width: 640px) {
      nav.uc-enter-nav > div {
        padding: 14px 16px !important;
        gap: 10px !important;
      }
      nav.uc-enter-nav .uc-cta-primary {
        padding: 8px 14px !important;
        font-size: 13px !important;
      }
    }

    /* Footer: 5-col -> 2-col on tablet, 1-col on mobile */
    @media (max-width: 1024px) {
      .uc-footer-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 32px !important;
      }
    }
    @media (max-width: 640px) {
      .uc-footer-grid {
        grid-template-columns: 1fr !important;
      }
    }

    /* Focus-visible: deep-dive in-section sticky nav. Other links and CTAs
       fall through to the browser default ring; the deep-dive variant gets
       an explicit Azure outline because the link otherwise has no chrome. */
    .uc-deepdive-nav nav a:focus-visible {
      outline: 2px solid #046CDE;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Reduced motion: cancel hover-driven transforms (CTA, deep-dive nav)
       so users with the preference don't get sliding indicators or scale
       shifts on interaction. Entrance animations already opt in via the
       .uc-enter / .uc-reveal / .uc-stagger reset above. */
    @media (prefers-reduced-motion: reduce) {
      .uc-cta-primary,
      .uc-cta-ghost,
      .uc-deepdive-nav nav a {
        transition-duration: 0.01ms !important;
      }
      .uc-deepdive-dot {
        transition: none !important;
      }
    }
  </style>

    const { useState, useMemo, useRef, useEffect, useContext, createContext } = React;

    /* =====================================================================
       Demo modal: shared open/close context.
       Wire your HubSpot account by replacing the two constants below.
       The submission endpoint is the public Forms API v3 (no auth required).
       ===================================================================== */
    const HUBSPOT_PORTAL_ID = 'YOUR_PORTAL_ID';
    const HUBSPOT_FORM_GUID = 'YOUR_FORM_GUID';
    const DemoContext = createContext(() => {});

    /* =====================================================================
       Animation primitives
       ===================================================================== */

    /* Reveal-on-scroll hook — returns [ref, isVisible]. Triggers once. */
    function useReveal(options = {}) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        // Respect reduced-motion: show immediately
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          setVisible(true);
          return;
        }
        // If IntersectionObserver is unavailable, degrade to instant reveal
        if (typeof IntersectionObserver === 'undefined') {
          setVisible(true);
          return;
        }
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                setVisible(true);
                io.disconnect();
              }
            });
          },
          { threshold: 0.15, rootMargin: '0px 0px -60px 0px', ...options },
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return [ref, visible];
    }

    /* Reveal wrapper — adds .uc-reveal and toggles .is-visible on scroll into view.
       stagger=true applies the .uc-stagger class instead so children animate in sequence. */
    function Reveal({ as: Tag = 'div', stagger = false, className = '', style, children, ...rest }) {
      const [ref, visible] = useReveal();
      const base = stagger ? 'uc-stagger' : 'uc-reveal';
      return (
        <Tag
          ref={ref}
          className={`${base}${visible ? ' is-visible' : ''}${className ? ' ' + className : ''}`}
          style={style}
          {...rest}
        >
          {children}
        </Tag>
      );
    }

    /* Counter — animates a number from 0 to target on mount, with cubic ease-out. */
    function Counter({ value, duration = 1800, decimals = 0, prefix = '', suffix = '' }) {
      const [display, setDisplay] = useState(decimals > 0 ? (0).toFixed(decimals) : '0');
      useEffect(() => {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          setDisplay(decimals > 0 ? value.toFixed(decimals) : String(Math.round(value)));
          return;
        }
        let start = null;
        let raf;
        const step = (ts) => {
          if (start === null) start = ts;
          const t = Math.min(1, (ts - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
          const v = eased * value;
          setDisplay(decimals > 0 ? v.toFixed(decimals) : String(Math.round(v)));
          if (t < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [value, duration, decimals]);
      return <>{prefix}{display}{suffix}</>;
    }

       Brand constants — Palette v2
       Mirrors the CSS :root tokens above. Roles are explicit per palette
       documentation; see contrast notes for which surface each works on.
       ===================================================================== */

    const MIDNIGHT    = '#020D4C';   // dark surface (hero, footer)
    const ROYAL_BLUE  = '#01318F';   // logo, headlines, accent text on white  (AAA)

    // Secondary
    const MIST        = '#EAF2F9';   // bg fill (cool light) / chip backgrounds
    const FOG         = '#DFE3EA';   // bg fill (neutral light)
    const AZURE       = '#046CDE';   // primary CTA / buttons  (AA on white)

    // Extended
    const SKY_CYAN    = '#00C7FE';   // secondary CTA on dark  (AAA on midnight)
    const EMERALD     = '#018744';   // success accent  (AA on white)
    const AMBER       = '#FFAF0F';   // accent — DARK-SURFACE ONLY (chart thresholds, badges)
    const SLATE       = '#3C4554';   // paragraph text  (AAA on white)

    // Tints — gradients and decorative backgrounds only
    const TINT_SKY     = '#80E3FE';
    const TINT_MINT    = '#80D4AA';
    const TINT_ICE     = '#BFF1FF';
    const TINT_SEAFOAM = '#BFE9D4';

    // Functional / status (outside brand palette — kept for in-product UI)
    const STATUS_RED      = '#E53935';
    const STATUS_RED_BG   = '#FDECEA';
    const STATUS_GREEN_BG = '#E8F5E9';

    // Platform UI scaffolding (canvas, dividers, body text)
    const CANVAS      = '#F2F4F7';
    const DIVIDER     = '#E4E7EC';
    const TEXT        = '#101828';
    const TEXT_MUTED  = '#667085';

    /* =====================================================================
       Icon helpers
       ===================================================================== */
    function MI({ name, size = 20, fill = 0, weight = 400, style = {}, label }) {
      const decorative = !label;
      return (
        <span
          className="material-symbols-rounded"
          aria-hidden={decorative ? 'true' : undefined}
          aria-label={label}
          role={label ? 'img' : undefined}
          style={{
            fontSize: size,
            lineHeight: 1,
            fontVariationSettings: `"FILL" ${fill}, "wght" ${weight}, "GRAD" 0, "opsz" 24`,
            ...style,
          }}
        >
          {name}
        </span>
      );
    }

    /* =====================================================================
       Uncountable logo — inlined from assets/logos/uncountable-logo-dark.svg

    function NavBar() {

        { label: 'Customers', href: '#customers' },

      const openDemo = useContext(DemoContext);
      const handleAnchor = (href) => (e) => {

        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      return (
        <nav className="uc-enter-nav" style={{
          position: 'sticky',
          top: 0,
          zIndex: 10,
          background: 'rgba(255,255,255,0.92)',
          backdropFilter: 'blur(10px)',
          WebkitBackdropFilter: 'blur(10px)',
          borderBottom: '1px solid rgba(60,69,84,0.08)',
        }}>
          <div style={{
            maxWidth: 1312,
            margin: '0 auto',
            padding: '16px 32px',
            display: 'flex',
            alignItems: 'center',
            gap: 28,
          }}>
            <a href="#" style={{ color: ROYAL_BLUE, display: 'inline-flex', alignItems: 'center', flexShrink: 0 }}>
              <UncountableLogo height={32} />
            </a>
            <div style={{ flex: 1 }} />
            <div className="uc-nav-mid" style={{
              display: 'flex',
              alignItems: 'center',
              gap: 28,
              fontSize: 14,
              fontWeight: 500,
            }}>
              {links.map((l) => (
                <a key={l.href} className="uc-nav-link uc-nav-mid-link"

                    color: SLATE,

              color: '#fff',
              border: 0,
              padding: '10px 18px',

    /* Hero's right-side "platform preview" — built from mini versions of real components */

        'swap_vert', 'biotech', 'description', 'analytics', 'calculate', 'tune',
      ];
      const topActions = [
        { label: 'All Lots', icon: 'list_alt', color: TEXT_MUTED },
        { label: 'Station 1: Charts', icon: 'insights', color: TEXT_MUTED },
        { label: 'Trigger Incident', icon: 'warning', color: STATUS_RED },
        { label: 'Upload Data', icon: 'upload', color: AZURE },
      ];
      const queue = [
        { t: '-23m', bg: STATUS_RED_BG, a: 'pH' },
        { t: '-23m', bg: STATUS_RED_BG, a: 'Net Weight' },
        { t: '36m', bg: STATUS_GREEN_BG, a: 'pH' },
        { t: '1h 36m', bg: STATUS_GREEN_BG, a: 'pH' },
        { t: '2h 36m', bg: STATUS_GREEN_BG, a: 'pH' },
        { t: '3h 36m', bg: STATUS_GREEN_BG, a: 'Net Wt.' },
        { t: '4h 36m', bg: STATUS_GREEN_BG, a: 'pH' },
      ];
      const netWeightPts = Array.from({ length: 22 }, (_, i) => 30 + Math.sin(i * 0.6) * 18 + (i % 4) * 2);
      const phPts = Array.from({ length: 22 }, (_, i) => 24 + Math.sin(i * 0.8 + 2) * 10);

      return (
        <div style={{
          position: 'relative',
          borderRadius: 12,
          overflow: 'hidden',

          aspectRatio: '16/10',
        }}>

          <div style={{
            height: 28,
            background: CANVAS,
            borderBottom: `1px solid ${DIVIDER}`,
            display: 'flex',
            alignItems: 'center',
            padding: '0 10px',
            gap: 6,
          }}>
            <span style={{ width: 10, height: 10, borderRadius: '50%', background: '#FF6058' }} />
            <span style={{ width: 10, height: 10, borderRadius: '50%', background: '#FFBC2D' }} />
            <span style={{ width: 10, height: 10, borderRadius: '50%', background: '#28C940' }} />

              app.uncountable.com · Production: Station 1
            </div>
          </div>

          <div style={{ display: 'flex', height: 'calc(100% - 28px)', fontSize: 10, color: SLATE }}>
            {/* Mini sidebar */}
            <div style={{
              width: 34,
              background: '#fff',
              borderRight: `1px solid ${DIVIDER}`,
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              gap: 10,
              padding: '8px 0',
            }}>
              {sidebarIcons.map((name, k) => (
                <MI key={k} name={name} size={14} style={{ color: k === 5 ? AZURE : TEXT_MUTED }} />
              ))}
            </div>

            {/* Content */}
            <div style={{ flex: 1, background: CANVAS, padding: '10px 12px', overflow: 'hidden' }}>
              {/* Top row */}
              <div style={{
                display: 'grid',
                gridTemplateColumns: '1fr 1fr 1.2fr 1fr 1fr',
                gap: 6,
                marginBottom: 8,
              }}>
                <div style={{
                  background: '#fff',
                  border: `1px solid ${DIVIDER}`,
                  borderRadius: 3,
                  padding: '6px 8px',
                  textAlign: 'center',
                }}>
                  <div style={{ fontSize: 7, color: TEXT_MUTED }}>Current Product:</div>
                  <div style={{ fontSize: 10, fontWeight: 600, color: AZURE }}>HeartWise Tomato</div>

                {topActions.map((a, k) => (
                  <div key={k} style={{
                    background: '#fff',

                    padding: '6px 4px',
                    textAlign: 'center',
                    fontSize: 8,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',

                    <MI name={a.icon} size={10} style={{ color: a.color }} /> {a.label}

                ))}
              </div>

              {/* 3-panel body */}
              <div style={{
                display: 'grid',
                gridTemplateColumns: '1fr 1.4fr 1fr',
                gap: 6,
                height: 'calc(100% - 40px)',

                  background: '#fff',
                  border: `1px solid ${DIVIDER}`,

                  overflow: 'hidden',

                    fontSize: 8,

                    <div key={i} style={{

                      gridTemplateColumns: '38px 30px 1fr',
                      gap: 2,
                      padding: '2px 4px',
                      borderBottom: `1px solid ${CANVAS}`,
                      alignItems: 'center',
                      fontSize: 7,
                    }}>
                      <div style={{ background: r.bg, textAlign: 'center', padding: '2px 0', borderRadius: 2 }}>
                        {r.t}
                      </div>
                      <div style={{
                        background: '#fff',
                        border: `1px solid ${DIVIDER}`,
                        textAlign: 'center',
                        borderRadius: 2,
                        fontSize: 6,
                        color: AZURE,
                      }}>
                        Enter

                      <div style={{ fontWeight: 500, fontSize: 8 }}>{r.a}</div>

                    <path d={netWeightPts.map((v, i) => `${i ? 'L' : 'M'}${10 + i * 8.4},${v}`).join('')}

                      <circle key={i} cx={10 + i * 8.4} cy={v} r=".9" fill={AZURE} />
                    ))}
                  </svg>
                  <div style={{ fontSize: 7, color: TEXT_MUTED, marginTop: 4, marginBottom: 2 }}>pH</div>
                  <svg width="100%" viewBox="0 0 200 50" style={{ display: 'block' }}>
                    <line x1="10" y1="42" x2="195" y2="42" stroke="#D0D5DD" strokeWidth=".3" />

                    <line x1="10" y1="36" x2="195" y2="36" stroke={STATUS_RED} strokeWidth=".3" strokeDasharray="2 1" />
                    <path d={phPts.map((v, i) => `${i ? 'L' : 'M'}${10 + i * 8.4},${v}`).join('')}

                </div>

                {/* Alerts */}
                <div style={{
                  background: '#fff',
                  border: `1px solid ${DIVIDER}`,
                  borderRadius: 3,
                  padding: '4px 6px',

                    <div style={{ fontSize: 6 }}>No records match.</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const DEMO_FIELD_INPUT_STYLE = {

    function DemoModal({ open, onClose }) {
      const initialForm = {
        firstname: '', lastname: '', company: '', jobtitle: '',
        email: '', job_function: '', phone: '', lab_size: '',
      };
      const [form, setForm] = useState(initialForm);
      const [status, setStatus] = useState('idle'); // idle | submitting | success | error
      const [errorMsg, setErrorMsg] = useState('');
      const firstFieldRef = useRef(null);
      const lastFocusedRef = useRef(null);

      const update = (name) => (e) => setForm((f) => ({ ...f, [name]: e.target.value }));

      // Lock body scroll, save focus, close on ESC
      useEffect(() => {
        if (!open) return;
        lastFocusedRef.current = document.activeElement;
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        // focus first field after paint
        const t = setTimeout(() => firstFieldRef.current && firstFieldRef.current.focus(), 30);
        return () => {
          document.body.style.overflow = prevOverflow;
          window.removeEventListener('keydown', onKey);
          clearTimeout(t);
        };
      }, [open, onClose]);

      // Reset state when closed (after a short delay so the closed state isn't visible mid-fade)
      useEffect(() => {
        if (open) return;
        const t = setTimeout(() => {
          setForm(initialForm);
          setStatus('idle');
          setErrorMsg('');
        }, 250);
        return () => clearTimeout(t);
      }, [open]);

      // Restore focus to whatever opened the modal
      useEffect(() => {
        if (open) return;
        if (lastFocusedRef.current && lastFocusedRef.current.focus) {
          lastFocusedRef.current.focus();
        }
      }, [open]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (status === 'submitting') return;
        setStatus('submitting');
        setErrorMsg('');
        try {
          const fields = Object.entries(form)
            .filter(([, v]) => v !== '')
            .map(([name, value]) => ({ objectTypeId: '0-1', name, value }));
          const url = `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_PORTAL_ID}/${HUBSPOT_FORM_GUID}`;
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fields,
              context: {
                pageUri: typeof window !== 'undefined' ? window.location.href : '',
                pageName: typeof document !== 'undefined' ? document.title : '',
              },
            }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            const msg = (body.errors && body.errors[0] && body.errors[0].message)
              || body.message
              || `Submission failed (${res.status}).`;
            throw new Error(msg);
          }
          setStatus('success');
        } catch (err) {
          setStatus('error');
          setErrorMsg(err.message || 'Submission failed. Try again.');
        }
      };

      if (!open) return null;

      return (
        <div
          role="dialog"
          aria-modal="true"
          aria-labelledby="demo-modal-title"
          style={{
            position: 'fixed', inset: 0, zIndex: 200,
            display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
            padding: '5vh 16px',
            overflowY: 'auto',
          }}
        >
          {/* Backdrop */}
          <div
            onClick={onClose}
            aria-hidden="true"
            style={{
              position: 'fixed', inset: 0,
              background: 'rgba(2, 13, 76, 0.55)',
              backdropFilter: 'blur(4px)',
              WebkitBackdropFilter: 'blur(4px)',
              animation: 'uc-fade 180ms ease both',
            }}
          />
          {/* Card */}
          <div
            role="document"
            style={{
              position: 'relative',
              zIndex: 1,
              background: '#fff',
              borderRadius: 10,
              boxShadow: '0 32px 64px -16px rgba(2,13,76,0.55), 0 0 0 1px rgba(60,69,84,0.06)',
              width: '100%',
              maxWidth: 540,
              padding: '36px 36px 32px',
              animation: 'uc-fade-up 240ms cubic-bezier(0.22, 0.61, 0.36, 1) both',
            }}
          >
            <button
              type="button"
              onClick={onClose}
              aria-label="Close demo request form"
              style={{
                position: 'absolute',
                top: 14, right: 14,
                width: 32, height: 32,
                borderRadius: 4,
                border: 0,
                background: 'transparent',
                color: SLATE,
                cursor: 'pointer',
                display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                transition: 'background 120ms ease',
              }}
              onMouseEnter={(e) => { e.currentTarget.style.background = MIST; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; }}
            >
              <MI name="close" size={20} />
            </button>

            {status === 'success' ? (
              <div style={{ paddingTop: 8, paddingBottom: 8, textAlign: 'left' }}>
                <div style={{
                  width: 56, height: 56, borderRadius: '50%',
                  background: STATUS_GREEN_BG,
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                  marginBottom: 18,
                }}>
                  <MI name="check" size={28} style={{ color: EMERALD }} />
                </div>
                <h2 id="demo-modal-title" style={{
                  fontSize: 26, fontWeight: 500,
                  letterSpacing: '-0.01em', lineHeight: 1.2,
                  margin: '0 0 10px',
                  color: SLATE,
                }}>
                  Thanks. We'll be in touch.
                </h2>
                <p style={{ fontSize: 15, lineHeight: 1.6, color: 'rgba(60,69,84,0.78)', margin: '0 0 22px' }}>
                  An Uncountable team member will reach out within one business day to schedule a demo tailored to your program.
                </p>
                <button
                  type="button"
                  onClick={onClose}
                  style={{
                    background: AZURE, color: '#fff', border: 0,
                    padding: '10px 18px', borderRadius: 4,
                    fontSize: 14, fontWeight: 500, cursor: 'pointer',
                  }}
                >
                  Close
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} noValidate={false} style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                <div>
                  <h2 id="demo-modal-title" style={{
                    fontSize: 24, fontWeight: 500,
                    letterSpacing: '-0.01em', lineHeight: 1.2,
                    margin: '0 0 6px', color: SLATE,
                  }}>
                    Request a Demo
                  </h2>
                  <p style={{ fontSize: 14, lineHeight: 1.55, color: 'rgba(60,69,84,0.7)', margin: 0 }}>
                    A 30-minute walk-through tailored to your R&amp;D program. We'll be in touch within one business day.
                  </p>
                </div>

                <div className="uc-demo-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12 }}>
                  <DemoField label="First name" required>
                    <input
                      ref={firstFieldRef}
                      type="text" name="firstname" required
                      autoComplete="given-name"
                      value={form.firstname} onChange={update('firstname')}
                      style={DEMO_FIELD_INPUT_STYLE}
                      onFocus={(e) => e.target.style.borderColor = AZURE}
                      onBlur={(e) => e.target.style.borderColor = DIVIDER}
                    />
                  </DemoField>
                  <DemoField label="Last name" required>
                    <input
                      type="text" name="lastname" required
                      autoComplete="family-name"
                      value={form.lastname} onChange={update('lastname')}
                      style={DEMO_FIELD_INPUT_STYLE}
                      onFocus={(e) => e.target.style.borderColor = AZURE}
                      onBlur={(e) => e.target.style.borderColor = DIVIDER}
                    />
                  </DemoField>
                </div>

                <DemoField label="Company" required>
                  <input
                    type="text" name="company" required
                    autoComplete="organization"
                    value={form.company} onChange={update('company')}
                    style={DEMO_FIELD_INPUT_STYLE}
                    onFocus={(e) => e.target.style.borderColor = AZURE}
                    onBlur={(e) => e.target.style.borderColor = DIVIDER}
                  />
                </DemoField>

                <DemoField label="Job title" required>
                  <input
                    type="text" name="jobtitle" required
                    autoComplete="organization-title"
                    value={form.jobtitle} onChange={update('jobtitle')}
                    style={DEMO_FIELD_INPUT_STYLE}
                    onFocus={(e) => e.target.style.borderColor = AZURE}
                    onBlur={(e) => e.target.style.borderColor = DIVIDER}
                  />
                </DemoField>

                <DemoField label="Business email" required>
                  <input
                    type="email" name="email" required
                    autoComplete="email"
                    value={form.email} onChange={update('email')}
                    style={DEMO_FIELD_INPUT_STYLE}
                    onFocus={(e) => e.target.style.borderColor = AZURE}
                    onBlur={(e) => e.target.style.borderColor = DIVIDER}
                  />
                </DemoField>

                <div className="uc-demo-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12 }}>
                  <DemoField label="Job function" required>
                    <select
                      name="job_function" required
                      value={form.job_function} onChange={update('job_function')}
                      style={DEMO_FIELD_INPUT_STYLE}
                      onFocus={(e) => e.target.style.borderColor = AZURE}
                      onBlur={(e) => e.target.style.borderColor = DIVIDER}
                    >
                      <option value="">Select…</option>
                      <option>R&amp;D / Research</option>
                      <option>Process / Manufacturing Engineering</option>
                      <option>Materials Science</option>
                      <option>Quality / QA / QC</option>
                      <option>Data Science / Informatics</option>
                      <option>IT / Engineering Leadership</option>
                      <option>Procurement</option>
                      <option>Other</option>
                    </select>
                  </DemoField>
                  <DemoField label="Lab size" required>
                    <select
                      name="lab_size" required
                      value={form.lab_size} onChange={update('lab_size')}
                      style={DEMO_FIELD_INPUT_STYLE}
                      onFocus={(e) => e.target.style.borderColor = AZURE}
                      onBlur={(e) => e.target.style.borderColor = DIVIDER}
                    >
                      <option value="">Select…</option>
                      <option>1 to 10</option>
                      <option>11 to 50</option>
                      <option>51 to 200</option>
                      <option>200+</option>
                    </select>
                  </DemoField>
                </div>

                <DemoField label="Phone">
                  <input
                    type="tel" name="phone"
                    autoComplete="tel"
                    value={form.phone} onChange={update('phone')}
                    style={DEMO_FIELD_INPUT_STYLE}
                    onFocus={(e) => e.target.style.borderColor = AZURE}
                    onBlur={(e) => e.target.style.borderColor = DIVIDER}
                  />
                </DemoField>

                {status === 'error' && (
                  <div role="alert" style={{
                    background: STATUS_RED_BG,
                    color: STATUS_RED,
                    fontSize: 13, fontWeight: 500,
                    padding: '10px 12px', borderRadius: 4,
                    display: 'flex', alignItems: 'center', gap: 8,
                  }}>
                    <MI name="error" size={16} fill={1} />
                    <span>{errorMsg}</span>
                  </div>
                )}

                <button
                  type="submit"
                  disabled={status === 'submitting'}
                  style={{
                    background: AZURE, color: '#fff', border: 0,
                    padding: '12px 18px', borderRadius: 4,
                    fontSize: 15, fontWeight: 500,
                    cursor: status === 'submitting' ? 'wait' : 'pointer',
                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                    gap: 8,
                    opacity: status === 'submitting' ? 0.7 : 1,
                    transition: 'opacity 120ms ease',
                    marginTop: 6,
                  }}
                >
                  {status === 'submitting' ? 'Submitting…' : (<>Request a Demo <MI name="arrow_forward" size={16} /></>)}
                </button>

                <p style={{ fontSize: 11, color: 'rgba(60,69,84,0.55)', lineHeight: 1.5, margin: '4px 0 0' }}>
                  By submitting, you agree to be contacted by Uncountable about this request.
                </p>
              </form>
            )}
          </div>
        </div>
      );
    }

    function MarketingPage() {
      const [demoOpen, setDemoOpen] = useState(false);
      const openDemo = useMemo(() => () => setDemoOpen(true), []);
      const closeDemo = () => setDemoOpen(false);
      return (
        <DemoContext.Provider value={openDemo}>
          <div>
            <NavBar />
            <HeroB />
            <LogoStrip />
            <OutcomesBand />
            <PlatformDeepDive />
            <CustomerVoices />
            <CTABand />
            <Footer />
          </div>
          <DemoModal open={demoOpen} onClose={closeDemo} />
        </DemoContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MarketingPage />);
  </script>
</body>
</html>
