<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uncountable Design System</title>

  <!-- Fonts: Poppins (brand) + Material Symbols Rounded (iconography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  />

  <style>
    /* ======================================================
       Uncountable Design System — foundation tokens
       Palette v2 (post-rebrand). See JS constants below for
       semantic role mapping. WCAG ratings against intended
       surface (white or midnight) — all foreground roles
       pass AA or higher; tints and decorative backgrounds
       are dark-surface-only.
       ====================================================== */
    :root {
      /* Primary */
      --uc-white:        #FFFFFF;            /* bg fill */
      --uc-midnight:     #020D4C;            /* bg fill (dark) */
      --uc-royal-blue:   #01318F;            /* logo / headlines  AAA on white */

      /* Secondary */
      --uc-mist:         #EAF2F9;            /* bg fill (cool light) */
      --uc-fog:          #DFE3EA;            /* bg fill (neutral light) */
      --uc-azure:        #046CDE;            /* primary CTA / buttons  AA on white */

      /* Extended */
      --uc-sky-cyan:     #00C7FE;            /* secondary CTA on dark  AAA on midnight */
      --uc-emerald:      #018744;            /* extended accent  AA on white */
      --uc-amber:        #FFAF0F;            /* extended accent — DARK-SURFACE ONLY */
      --uc-slate:        #3C4554;            /* paragraph text  AAA on white */

      /* Tints — limited use for gradients and decorative backgrounds */
      --uc-tint-sky:     #80E3FE;
      --uc-tint-mint:    #80D4AA;
      --uc-tint-ice:     #BFF1FF;
      --uc-tint-seafoam: #BFE9D4;

      /* Functional / status (outside brand palette — kept for in-product UI) */
      --uc-status-red:        #E53935;
      --uc-status-red-bg:     #FDECEA;
      --uc-status-green-bg:   #E8F5E9;

      /* Type */
      --uc-font-sans: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--uc-font-sans);
      color: var(--uc-slate);
      background: #fff;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Material Symbols base sizing is controlled by inline font-size */
    .material-symbols-rounded {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }

    button { font-family: inherit; }
    input { font-family: inherit; }

    /* ======================================================
       Animations — minimal, brand-appropriate
       Uncountable brand rule: short fades (120–200ms base,
       up to 500ms for entrances), ease-out, no springs.
       ====================================================== */
    @keyframes uc-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes uc-fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes uc-fade-down {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes uc-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Above-the-fold entrance — plays on mount with cubic ease-out */
    .uc-enter     { animation: uc-fade-up 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    .uc-enter-nav { animation: uc-fade-down 700ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    .uc-enter-d0  { animation-delay:    0ms; }
    .uc-enter-d1  { animation-delay:  140ms; }
    .uc-enter-d2  { animation-delay:  280ms; }
    .uc-enter-d3  { animation-delay:  420ms; }
    .uc-enter-d4  { animation-delay:  560ms; }
    .uc-enter-d5  { animation-delay:  720ms; }
    .uc-enter-d6  { animation-delay:  900ms; }
    .uc-enter-d7  { animation-delay: 1080ms; }

    /* Below-the-fold reveal — driven by IntersectionObserver adding .is-visible */
    .uc-reveal {
      opacity: 0;
      transform: translateY(14px);
      transition:
        opacity 900ms cubic-bezier(0.22, 0.61, 0.36, 1),
        transform 900ms cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: opacity, transform;
    }
    .uc-reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Stagger container — children animate in sequence when the parent becomes visible */
    .uc-stagger > * {
      opacity: 0;
      transform: translateY(12px);
      transition:
        opacity 800ms cubic-bezier(0.22, 0.61, 0.36, 1),
        transform 800ms cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: opacity, transform;
    }
    .uc-stagger.is-visible > * { opacity: 1; transform: translateY(0); }
    .uc-stagger.is-visible > *:nth-child(1) { transition-delay:   0ms; }
    .uc-stagger.is-visible > *:nth-child(2) { transition-delay: 120ms; }
    .uc-stagger.is-visible > *:nth-child(3) { transition-delay: 240ms; }
    .uc-stagger.is-visible > *:nth-child(4) { transition-delay: 360ms; }
    .uc-stagger.is-visible > *:nth-child(5) { transition-delay: 480ms; }
    .uc-stagger.is-visible > *:nth-child(6) { transition-delay: 600ms; }

    /* Respect user preference — no motion if requested */
    @media (prefers-reduced-motion: reduce) {
      .uc-enter, .uc-enter-nav,
      .uc-reveal, .uc-reveal.is-visible,
      .uc-stagger > *, .uc-stagger.is-visible > * {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    /* Marketing: hover transitions */
    .uc-feature-card {
      transition: box-shadow 150ms ease, border-color 150ms ease, transform 150ms ease;
    }
    .uc-feature-card:hover {
      box-shadow: 0 10px 24px -10px rgba(2, 13, 76, 0.18);
      border-color: rgba(60, 69, 84, 0.2);
    }
    .uc-nav-link {
      transition: opacity 120ms ease;
    }
    .uc-nav-link:hover { opacity: 0.65; }

    .uc-cta-primary {
      transition: background 120ms ease, transform 80ms ease;
    }
    .uc-cta-primary:hover { opacity: 0.92; }
    .uc-cta-primary:active { transform: translateY(1px); }

    .uc-cta-ghost {
      transition: background 120ms ease, border-color 120ms ease;
    }
    .uc-cta-ghost:hover { background: rgba(255, 255, 255, 0.08); }

    .uc-resource-card {
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .uc-resource-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -12px rgba(2, 13, 76, 0.22);
    }

    /* Scrollbar styling inside platform panels */
    .uc-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .uc-scroll::-webkit-scrollbar-track { background: transparent; }
    .uc-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 999px; }
    .uc-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.22); }

    /* ======================================================
       Landing v2 — responsive collapse rules
       Inline-style grids on the new sections need !important
       to override at narrow viewports.
       ====================================================== */

    /* StyleGuide responsive: at tablet and narrower, the sticky sidebar
       collapses above the content, becoming a horizontal scroll-tab strip.
       Anti-pattern do/dont 2-col rows and Copy & Voice 3-col rows stack to
       single column at the same breakpoint. The asset matrix and button-label
       grids are already breakpoint-free via auto-fit minmax(). */
    @media (max-width: 900px) {
      .uc-sg-grid {
        grid-template-columns: 1fr !important;
        gap: 24px !important;
      }
      .uc-sg-sidebar {
        position: static !important;
        top: auto !important;
        padding-top: 24px !important;
        overflow-x: auto;
      }
      .uc-sg-sidebar nav {
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        gap: 4px !important;
      }
      .uc-sg-sidebar nav a {
        white-space: nowrap;
        border-left: 0 !important;
      }
    }
    @media (max-width: 760px) {
      .uc-ap-row {
        grid-template-columns: 1fr !important;
      }
      .uc-voice-rule {
        grid-template-columns: 1fr !important;
      }
    }

    /* Typography rows have a fixed 120/1fr/240px desktop layout that
       can't fit a 320px viewport. Stack the columns under 600px. */
    @media (max-width: 600px) {
      .uc-sg-type-row {
        grid-template-columns: 1fr !important;
        gap: 8px !important;
      }
    }

    /* Focus-visible: keyboard users get an Azure outline on every clickable
       Style Guide chip / asset / row. Cancels the browser default ring. */
    .uc-sg button:focus-visible,
    .uc-sg a:focus-visible {
      outline: 2px solid #046CDE;
      outline-offset: 2px;
    }

    /* Reduced motion: cancel hover-driven transforms on the JS-driven
       onMouseEnter lifts (AssetTile, ColorSwatch) so the page snaps to the
       new state instead of animating into it. */
    @media (prefers-reduced-motion: reduce) {
      .uc-sg button,
      .uc-sg a {
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <!-- React + Babel (matches prototype loading pattern) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useMemo, useRef, useEffect } = React;

    /* =====================================================================
       Animation primitives
       ===================================================================== */

    /* Reveal-on-scroll hook — returns [ref, isVisible]. Triggers once. */
    function useReveal(options = {}) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        // Respect reduced-motion: show immediately
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          setVisible(true);
          return;
        }
        // If IntersectionObserver is unavailable, degrade to instant reveal
        if (typeof IntersectionObserver === 'undefined') {
          setVisible(true);
          return;
        }
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                setVisible(true);
                io.disconnect();
              }
            });
          },
          { threshold: 0.15, rootMargin: '0px 0px -60px 0px', ...options },
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return [ref, visible];
    }

    /* Reveal wrapper — adds .uc-reveal and toggles .is-visible on scroll into view.
       stagger=true applies the .uc-stagger class instead so children animate in sequence. */
    function Reveal({ as: Tag = 'div', stagger = false, className = '', style, children, ...rest }) {
      const [ref, visible] = useReveal();
      const base = stagger ? 'uc-stagger' : 'uc-reveal';
      return (
        <Tag
          ref={ref}
          className={`${base}${visible ? ' is-visible' : ''}${className ? ' ' + className : ''}`}
          style={style}
          {...rest}
        >
          {children}
        </Tag>
      );
    }

    /* Counter — animates a number from 0 to target on mount, with cubic ease-out. */
    function Counter({ value, duration = 1800, decimals = 0, prefix = '', suffix = '' }) {
      const [display, setDisplay] = useState(decimals > 0 ? (0).toFixed(decimals) : '0');
      useEffect(() => {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          setDisplay(decimals > 0 ? value.toFixed(decimals) : String(Math.round(value)));
          return;
        }
        let start = null;
        let raf;
        const step = (ts) => {
          if (start === null) start = ts;
          const t = Math.min(1, (ts - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
          const v = eased * value;
          setDisplay(decimals > 0 ? v.toFixed(decimals) : String(Math.round(v)));
          if (t < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [value, duration, decimals]);
      return <>{prefix}{display}{suffix}</>;
    }

    /* =====================================================================
       Brand constants — Palette v2
       Mirrors the CSS :root tokens above. Roles are explicit per palette
       documentation; see contrast notes for which surface each works on.
       ===================================================================== */

    // Primary
    const MIDNIGHT    = '#020D4C';   // dark surface (hero, footer)
    const ROYAL_BLUE  = '#01318F';   // logo, headlines, accent text on white  (AAA)

    // Secondary
    const MIST        = '#EAF2F9';   // bg fill (cool light) / chip backgrounds
    const FOG         = '#DFE3EA';   // bg fill (neutral light)
    const AZURE       = '#046CDE';   // primary CTA / buttons  (AA on white)

    // Extended
    const SKY_CYAN    = '#00C7FE';   // secondary CTA on dark  (AAA on midnight)
    const EMERALD     = '#018744';   // success accent  (AA on white)
    const AMBER       = '#FFAF0F';   // accent — DARK-SURFACE ONLY (chart thresholds, badges)
    const SLATE       = '#3C4554';   // paragraph text  (AAA on white)

    // Tints — gradients and decorative backgrounds only
    const TINT_SKY     = '#80E3FE';
    const TINT_MINT    = '#80D4AA';
    const TINT_ICE     = '#BFF1FF';
    const TINT_SEAFOAM = '#BFE9D4';

    // Functional / status (outside brand palette — kept for in-product UI)
    const STATUS_RED      = '#E53935';
    const STATUS_RED_BG   = '#FDECEA';
    const STATUS_GREEN_BG = '#E8F5E9';

    // Platform UI scaffolding (canvas, dividers, body text)
    const CANVAS      = '#F2F4F7';
    const DIVIDER     = '#E4E7EC';
    const TEXT        = '#101828';
    const TEXT_MUTED  = '#667085';

    /* =====================================================================
       Icon helpers
       ===================================================================== */
    function MI({ name, size = 20, fill = 0, weight = 400, style = {}, label }) {
      const decorative = !label;
      return (
        <span
          className="material-symbols-rounded"
          aria-hidden={decorative ? 'true' : undefined}
          aria-label={label}
          role={label ? 'img' : undefined}
          style={{
            fontSize: size,
            lineHeight: 1,
            fontVariationSettings: `"FILL" ${fill}, "wght" ${weight}, "GRAD" 0, "opsz" 24`,
            ...style,
          }}
        >
          {name}
        </span>
      );
    }

    /* Named-rule callout. Used inside SGSection to surface the system's doctrine. */
    function SGRule({ name, children }) {
      return (
        <div style={{
          marginTop: 18,
          padding: '14px 18px',
          background: MIST,
          border: `1px solid ${FOG}`,
          borderRadius: 8,
          fontSize: 13,
          color: SLATE,
          lineHeight: 1.6,
        }}>
          <strong style={{ color: ROYAL_BLUE, fontWeight: 600 }}>The {name} Rule.</strong>{' '}
          {children}
        </div>
      );
    }

    /* Clickable token chip — copies value to clipboard with momentary feedback. */
    function SGCopyValue({ value, label, width }) {
      const [copied, setCopied] = useState(false);
      return (
        <button
          onClick={async () => {
            try { await navigator.clipboard.writeText(label || value); } catch (e) { /* ignore */ }
            setCopied(true);
            setTimeout(() => setCopied(false), 1100);
          }}
          title={`Copy ${label || value}`}
          style={{
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            fontSize: 12,
            background: copied ? STATUS_GREEN_BG : MIST,
            color: copied ? EMERALD : ROYAL_BLUE,
            padding: '3px 8px',
            borderRadius: 3,
            border: `1px solid ${copied ? EMERALD : FOG}`,
            cursor: 'pointer',
            whiteSpace: 'nowrap',
            transition: 'background 120ms ease, color 120ms ease, border-color 120ms ease',
            display: 'inline-block',
            minWidth: width || 'auto',
            textAlign: 'left',
          }}
        >
          {copied ? 'Copied' : value}
        </button>
      );
    }

    /* Brand asset tile: clickable, copies its component reference. */
    function AssetTile({ bg, ink, mark, label, copyText }) {
      const [copied, setCopied] = useState(false);
      const dark = bg !== '#fff' && bg !== '#FFFFFF' && bg !== 'white';
      return (
        <button
          onClick={async () => {
            try { await navigator.clipboard.writeText(copyText); } catch (e) { /* ignore */ }
            setCopied(true);
            setTimeout(() => setCopied(false), 1200);
          }}
          title={`Copy ${copyText}`}
          style={{
            background: '#fff',
            border: `1px solid ${FOG}`,
            borderRadius: 8,
            padding: 0,
            overflow: 'hidden',
            cursor: 'pointer',
            textAlign: 'left',
            font: 'inherit',
            color: 'inherit',
            display: 'flex',
            flexDirection: 'column',
            transition: 'transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease',
          }}
          onMouseEnter={(e) => {
            e.currentTarget.style.transform = 'translateY(-2px)';
            e.currentTarget.style.boxShadow = '0 10px 24px -10px rgba(2,13,76,0.18)';
            e.currentTarget.style.borderColor = 'rgba(60,69,84,0.18)';
          }}
          onMouseLeave={(e) => {
            e.currentTarget.style.transform = '';
            e.currentTarget.style.boxShadow = '';
            e.currentTarget.style.borderColor = FOG;
          }}
        >
          <div style={{
            background: bg,
            color: ink,
            height: 110,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            position: 'relative',
            border: bg === '#fff' || bg === '#FFFFFF' ? `1px solid ${FOG}` : 'none',
          }}>
            {mark}
            {copied && (
              <span style={{
                position: 'absolute', bottom: 10, right: 10,
                background: 'rgba(0,0,0,0.7)', color: '#fff',
                fontSize: 11, fontWeight: 500, padding: '3px 8px', borderRadius: 4,
              }}>Copied</span>

          </div>
          <div style={{ padding: '12px 14px 14px' }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: ROYAL_BLUE, marginBottom: 4 }}>
              {label}

            <code style={{
              fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
              fontSize: 11,
              color: 'rgba(60,69,84,0.7)',

    function ColorSwatch({ entry }) {
      const [copied, setCopied] = useState(false);
      const isLight = ['#FFFFFF', '#EAF2F9', '#DFE3EA', '#80E3FE', '#80D4AA', '#BFF1FF', '#BFE9D4', '#FDECEA', '#E8F5E9', '#FFAF0F'].includes(entry.hex);
      const onCopy = async () => {
        try {
          await navigator.clipboard.writeText(entry.hex);
          setCopied(true);
          setTimeout(() => setCopied(false), 1200);
        } catch (e) { /* ignore — clipboard may be blocked */ }
      };
      const gradeColor = {
        'AAA': EMERALD,
        'AA':  EMERALD,
        'AA Large': AMBER,
      }[entry.grade] || SLATE;
      return (
        <button
          onClick={onCopy}
          title={`Click to copy ${entry.hex}`}
          style={{
            background: '#fff',
            border: `1px solid ${FOG}`,
            borderRadius: 8,
            padding: 0,
            overflow: 'hidden',
            cursor: 'pointer',
            textAlign: 'left',
            font: 'inherit',
            color: 'inherit',
            display: 'flex',
            flexDirection: 'column',
            transition: 'transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease',
          }}
          onMouseEnter={(e) => {
            e.currentTarget.style.transform = 'translateY(-2px)';
            e.currentTarget.style.boxShadow = '0 10px 24px -10px rgba(2,13,76,0.18)';
            e.currentTarget.style.borderColor = 'rgba(60,69,84,0.18)';
          }}
          onMouseLeave={(e) => {
            e.currentTarget.style.transform = '';
            e.currentTarget.style.boxShadow = '';
            e.currentTarget.style.borderColor = FOG;
          }}
        >
          <div style={{
            background: entry.hex,
            height: 96,
            position: 'relative',
            border: entry.hex === '#FFFFFF' ? `1px solid ${FOG}` : 'none',
            display: 'flex',
            alignItems: 'flex-end',
            justifyContent: 'flex-end',
            padding: 10,
          }}>
            {copied && (
              <span style={{
                background: 'rgba(0,0,0,0.7)',
                color: '#fff',
                fontSize: 11,
                fontWeight: 500,
                padding: '3px 8px',
                borderRadius: 4,
              }}>
                Copied
              </span>
            )}
          </div>
          <div style={{ padding: '12px 14px 14px' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
              <span style={{ fontSize: 14, fontWeight: 600, color: ROYAL_BLUE }}>{entry.name}</span>
              {entry.grade && (
                <span style={{
                  fontSize: 10,
                  fontWeight: 600,
                  letterSpacing: '.04em',
                  color: '#fff',

            <div style={{ fontSize: 12, color: 'rgba(60,69,84,0.78)', lineHeight: 1.4 }}>

            {entry.surface && entry.ratio && (
              <div style={{ fontSize: 11, color: 'rgba(60,69,84,0.6)', marginTop: 6 }}>
                {entry.ratio.toFixed(2)}:1 on {entry.surface}
              </div>
            )}
          </div>
        </button>
      );
    }

    /* Token chip — click-to-copy mono-styled label for code-level identifiers */
    function Token({ children }) {
      const [copied, setCopied] = useState(false);
      const renderToString = (c) => {
        if (c == null || typeof c === 'boolean') return '';
        if (typeof c === 'string' || typeof c === 'number') return String(c);
        if (Array.isArray(c)) return c.map(renderToString).join('');
        if (c && c.props && 'children' in c.props) return renderToString(c.props.children);
        return '';
      };
      const text = renderToString(children);
      return (
        <button
          onClick={async () => {
            try { await navigator.clipboard.writeText(text); } catch (e) { /* ignore */ }
            setCopied(true);
            setTimeout(() => setCopied(false), 1100);
          }}
          title={`Copy ${text}`}
          style={{
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            fontSize: 12,
            background: copied ? STATUS_GREEN_BG : MIST,
            color: copied ? EMERALD : ROYAL_BLUE,
            padding: '2px 7px',
            borderRadius: 3,
            border: `1px solid ${copied ? EMERALD : FOG}`,
            whiteSpace: 'nowrap',
            cursor: 'pointer',
            transition: 'background 120ms ease, color 120ms ease, border-color 120ms ease',
            display: 'inline-block',
            verticalAlign: 'baseline',
            lineHeight: 1.4,
          }}
        >
          {copied ? 'Copied' : children}
        </button>
      );
    }

    /* Section wrapper with anchor + heading */
    function SGSection({ id, title, lead, children }) {
      return (
        <section id={id} style={{
          paddingTop: 56,
          paddingBottom: 56,
          borderBottom: `1px solid ${FOG}`,
          scrollMarginTop: 24,
        }}>
          <h2 style={{
            fontSize: 32,
            fontWeight: 500,
            letterSpacing: '-0.01em',
            margin: '0 0 12px',
            color: ROYAL_BLUE,
          }}>
            {title}
          </h2>
          {lead && (
            <p style={{ fontSize: 15, color: SLATE, lineHeight: 1.6, maxWidth: 640, margin: '0 0 32px' }}>
              {lead}
            </p>
          )}
          {children}
        </section>
      );
    }

    function StyleGuide() {
      const sections = [
        { id: 'colors',       label: 'Colors' },

                    { v: 4,   common: false },
                    { v: 8,   common: true  },
                    { v: 12,  common: true  },
                    { v: 16,  common: true  },
                    { v: 24,  common: true  },
                    { v: 32,  common: true  },
                    { v: 48,  common: false },
                    { v: 64,  common: false },
                    { v: 96,  common: false },
                    { v: 120, common: false },
                  ].map((s) => (
                    <div key={s.v} style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                      <div style={{ width: 60, fontWeight: s.common ? 600 : 400, color: s.common ? ROYAL_BLUE : SLATE }}>
                        {s.v}px
                      </div>
                      <div style={{ width: s.v, height: 14, background: s.common ? AZURE : 'rgba(60,69,84,0.25)', borderRadius: 2 }} />
                    </div>
                  ))}
                </div>
              </SGSection>

              {/* LOGO & BRAND */}
              <SGSection
                id="brand"
                title="Logo & Brand"
                lead="The wordmark and hexagon mark are the only brand-identity assets sanctioned for system-wide use. Click an asset tile to copy its component reference. Favicon and social-card templates are placeholder slots until source assets are produced."
              >
                <h3 style={{ fontSize: 13, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,69,84,0.6)', margin: '0 0 14px' }}>
                  Asset matrix
                </h3>
                <div style={{
                  display: 'grid',
                  gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))',
                  gap: 16,
                  marginBottom: 40,
                }}>
                  <AssetTile bg="#fff"      ink={ROYAL_BLUE} mark={<UncountableLogo height={28} />} label="Wordmark · Color"      copyText="<UncountableLogo height={28} />" />
                  <AssetTile bg={MIDNIGHT}  ink="#fff"       mark={<UncountableLogo height={28} />} label="Wordmark · On Midnight" copyText="<UncountableLogo height={28} />" />
                  <AssetTile bg="#fff"      ink={SLATE}      mark={<UncountableLogo height={28} />} label="Wordmark · Mono"        copyText="<UncountableLogo height={28} />" />
                  <AssetTile bg="#fff"      ink={ROYAL_BLUE} mark={<HexagonMark height={36} />}     label="Hexagon · Color"        copyText="<HexagonMark height={32} />" />
                  <AssetTile bg={MIDNIGHT}  ink="#fff"       mark={<HexagonMark height={36} />}     label="Hexagon · On Midnight"  copyText="<HexagonMark height={32} />" />
                  <AssetTile bg="#fff"      ink={SLATE}      mark={<HexagonMark height={36} />}     label="Hexagon · Mono"         copyText="<HexagonMark height={32} />" />
                  <AssetTilePlaceholder label="Favicon"      body="16 / 32 / 64 px set required" />
                  <AssetTilePlaceholder label="Social Card"  body="1200 × 630, safe-area documented" />
                </div>

                <h3 style={{ fontSize: 13, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,69,84,0.6)', margin: '0 0 14px' }}>
                  Usage rules
                </h3>
                <SGRule name="Clear-Space">
                  Reserve at least 1× the cap-height of the wordmark (or 0.5× the hex height) on every side. Don't crowd the mark with adjacent type, edges, photography, or stickers.
                </SGRule>
                <SGRule name="Minimum-Size">
                  Wordmark renders at 24px height minimum; hexagon mark at 16px. Below that, the geometry degrades and it stops reading as Uncountable. Prefer the hexagon at small sizes.
                </SGRule>
                <SGRule name="Single-Color">
                  The marks render only in Royal Blue (light surfaces), White (midnight surfaces), or Slate (mono / single-color print). Any other tint breaks the register. Gradients on the mark are forbidden.
                </SGRule>
                <SGRule name="No-Distortion">
                  Never skew, rotate, stretch, or recolor outside the sanctioned palette. The hexagon's geometry is the brand cue. If a layout pressures the mark to bend, change the layout.
                </SGRule>
                <SGRule name="Co-Branding">
                  When pairing with a customer logo (case studies, partner badges), separate with a 1px Slate-15% vertical rule, equal-height alignment, equal optical weight. Never merge the marks into a combined lockup.
                </SGRule>
              </SGSection>

              {/* ANTI-PATTERNS */}
              <SGSection
                id="dont"
                title="Anti-Patterns"
                lead="Eight prohibited patterns from the system's doctrine, with the working version on the left and the violation on the right. Every Don't is enforceable; if you find yourself reaching for the right side, rework the element."
              >
                <div style={{ display: 'flex', flexDirection: 'column', gap: 40 }}>

                  {/* 1. Side-stripe borders */}
                  <AntiPatternRow
                    rule={{ name: 'Side-Stripe Borders', body: <>Decorative <Token>border-left</Token> &gt; 1px on cards, callouts, or alerts is banned. Use a full hairline border, a background tint, or nothing. The 2px Royal Blue active-nav bar is the only sanctioned exception.</> }}
                    doNode={
                      <div style={{ width: 240, padding: 14, background: '#fff', border: `1px solid rgba(60,69,84,0.10)`, borderRadius: 6 }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: SLATE, marginBottom: 4 }}>Within spec</div>
                        <div style={{ fontSize: 12, color: 'rgba(60,69,84,0.65)' }}>Hairline border, no decoration.</div>
                      </div>
                    }
                    dontNode={
                      <div style={{ width: 240, padding: 14, background: '#fff', border: `1px solid rgba(60,69,84,0.10)`, borderLeft: `4px solid ${ROYAL_BLUE}`, borderRadius: 6 }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: SLATE, marginBottom: 4 }}>Within spec</div>
                        <div style={{ fontSize: 12, color: 'rgba(60,69,84,0.65)' }}>Stripe pretends to be meaning.</div>
                      </div>
                    }
                  />

                  {/* 2. Gradient text */}
                  <AntiPatternRow
                    rule={{ name: 'Gradient-Text', body: <>Headlines render in a single solid color. <Token>background-clip: text</Token> with a gradient on H1/H2 is decorative and dilutes the system. Emphasis comes from weight or size.</> }}
                    doNode={
                      <div style={{ fontSize: 28, fontWeight: 500, letterSpacing: '-0.01em', color: ROYAL_BLUE }}>
                        One unified data layer
                      </div>
                    }
                    dontNode={
                      <div style={{
                        fontSize: 28, fontWeight: 500, letterSpacing: '-0.01em',
                        backgroundImage: `linear-gradient(90deg, ${ROYAL_BLUE}, ${SKY_CYAN}, #B45309)`,
                        WebkitBackgroundClip: 'text', backgroundClip: 'text',
                        color: 'transparent',
                      }}>
                        One unified data layer
                      </div>
                    }
                  />

                  {/* 3. Color hover vs opacity hover */}
                  <AntiPatternRow
                    rule={{ name: 'Calm-Hover', body: <>Filled CTAs dim with <Token>opacity: 0.92</Token> on hover; ghosts tint with a faint overlay. Color shifts on hover read as marketing chrome and break the calm-authority register.</> }}
                    doNode={
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, alignItems: 'center' }}>
                        <button className="uc-cta-primary" style={{ background: AZURE, color: '#fff', border: 0, padding: '10px 18px', borderRadius: 4, fontSize: 14, fontWeight: 500, cursor: 'pointer' }}>
                          Request a Demo
                        </button>
                        <span style={{ fontSize: 11, color: 'rgba(60,69,84,0.6)' }}>hover ⟶ opacity 0.92</span>
                      </div>
                    }
                    dontNode={
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, alignItems: 'center' }}>
                        <button style={{ background: '#7B5CFF', color: '#fff', border: 0, padding: '10px 18px', borderRadius: 4, fontSize: 14, fontWeight: 500, cursor: 'pointer' }}>
                          Request a Demo
                        </button>
                        <span style={{ fontSize: 11, color: STATUS_RED }}>hover ⟶ different hue</span>
                      </div>
                    }
                  />

                  {/* 4. Pure-black shadow */}
                  <AntiPatternRow
                    rule={{ name: 'Midnight-Tinted Shadow', body: <>Every shadow uses <Token>rgba(2, 13, 76, ...)</Token>, never <Token>rgba(0, 0, 0, ...)</Token>. Pure black on the brand's blue palette reads as gray and pre-rebrand. The midnight tint is what makes elevation feel like it belongs to this system.</> }}
                    doNode={
                      <div style={{ width: 200, height: 84, background: '#fff', border: `1px solid ${FOG}`, borderRadius: 8, padding: 14, boxShadow: '0 14px 28px -12px rgba(2,13,76,0.32)' }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: ROYAL_BLUE }}>Midnight-tinted</div>
                        <div style={{ fontSize: 11, color: 'rgba(60,69,84,0.65)', marginTop: 4 }}>rgba(2, 13, 76, 0.32)</div>
                      </div>
                    }
                    dontNode={
                      <div style={{ width: 200, height: 84, background: '#fff', border: `1px solid ${FOG}`, borderRadius: 8, padding: 14, boxShadow: '0 14px 28px -12px rgba(0,0,0,0.32)' }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: SLATE }}>Pure-black</div>
                        <div style={{ fontSize: 11, color: 'rgba(60,69,84,0.65)', marginTop: 4 }}>rgba(0, 0, 0, 0.32)</div>
                      </div>
                    }
                  />

                  {/* 5. Amber on white */}
                  <AntiPatternRow
                    rule={{ name: 'Amber Restriction', body: <>Amber (<Token>#FFAF0F</Token>) is dark-surface only. On white it can't reach AA contrast and reads as decorative. Warnings on white surfaces use Status Red BG with Status Red text.</> }}
                    doNode={
                      <span style={{
                        display: 'inline-flex', alignItems: 'center', gap: 4,
                        background: STATUS_RED_BG, color: STATUS_RED,
                        padding: '3px 9px', borderRadius: 3,
                        fontSize: 11, fontWeight: 600,
                        textTransform: 'uppercase', letterSpacing: '.04em',
                      }}>
                        <MI name="warning" size={12} fill={1} /> Out of Spec
                      </span>
                    }
                    dontNode={
                      <span style={{
                        display: 'inline-flex', alignItems: 'center', gap: 4,
                        color: AMBER, background: '#fff',
                        padding: '3px 9px', borderRadius: 3,
                        fontSize: 11, fontWeight: 600,
                        textTransform: 'uppercase', letterSpacing: '.04em',
                        border: `1px solid ${AMBER}`,
                      }}>
                        <MI name="warning" size={12} fill={1} /> Out of Spec
                      </span>
                    }
                  />

                  {/* 6. Em dash */}
                  <AntiPatternRow
                    rule={{ name: 'No-Em-Dash', body: <>Copy uses commas, colons, semicolons, periods, or parentheses. Em dashes (and double-hyphens) are banned across UI copy, error messages, and editorial prose. Sentences earn their own stops.</> }}
                    doNode={
                      <div style={{ fontSize: 18, fontWeight: 500, letterSpacing: '-0.005em', color: SLATE, textAlign: 'center', lineHeight: 1.4 }}>
                        Cut formulation cycles from 14 weeks to 5.<br />
                        <span style={{ fontSize: 13, color: 'rgba(60,69,84,0.6)', fontWeight: 400 }}>Beiersdorf, consumer-care R&amp;D</span>
                      </div>
                    }
                    dontNode={
                      <div style={{ fontSize: 18, fontWeight: 500, letterSpacing: '-0.005em', color: SLATE, textAlign: 'center', lineHeight: 1.4 }}>
                        Cut formulation cycles from 14 weeks to 5 — Beiersdorf
                      </div>
                    }
                  />

                  {/* 7. Hero-metric template */}
                  <AntiPatternRow
                    rule={{ name: 'No-Hero-Metric-Template', body: <>The big-number-with-tiny-label SaaS template is forbidden. Outcomes render as editorial declarations with named customer attribution. Numbers earn their place by being specific and tied to a real R&amp;D program.</> }}
                    doNode={
                      <div style={{ maxWidth: 240 }}>
                        <div style={{ fontSize: 18, fontWeight: 500, lineHeight: 1.3, color: SLATE, letterSpacing: '-0.005em' }}>
                          Eliminated 60% of redundant experiments before scale-up.
                        </div>
                        <div style={{ fontSize: 12, color: 'rgba(60,69,84,0.6)', marginTop: 8, fontWeight: 500 }}>
                          Sika, polymer materials
                        </div>
                      </div>
                    }
                    dontNode={
                      <div style={{
                        background: '#fff', border: `1px solid ${FOG}`, borderRadius: 8,
                        padding: 16, textAlign: 'center', width: 200,
                      }}>
                        <div style={{
                          fontSize: 36, fontWeight: 700,
                          backgroundImage: `linear-gradient(135deg, ${ROYAL_BLUE}, ${SKY_CYAN})`,
                          WebkitBackgroundClip: 'text', backgroundClip: 'text',
                          color: 'transparent',
                          letterSpacing: '-0.03em', lineHeight: 1,
                        }}>60%</div>
                        <div style={{ fontSize: 10, color: TEXT_MUTED, textTransform: 'uppercase', letterSpacing: '.08em', marginTop: 6 }}>
                          Faster experiments
                        </div>
                      </div>
                    }
                  />

                  {/* 8. Identical card grid */}
                  <AntiPatternRow
                    rule={{ name: 'No-Identical-Card-Grid', body: <>The 6-up icon + heading + text grid is the SaaS landing-page reflex. The platform deep-dive uses real product screens with alternating sides; capabilities don't render as identical decorative cards.</> }}
                    doNode={
                      <div style={{
                        display: 'grid', gridTemplateColumns: '1fr 1.2fr', gap: 12,
                        alignItems: 'center', maxWidth: 280,
                      }}>
                        <div style={{ fontSize: 12 }}>
                          <div style={{ fontSize: 10, color: ROYAL_BLUE, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.08em' }}>ELN</div>
                          <div style={{ fontSize: 14, fontWeight: 500, color: SLATE, marginTop: 4 }}>Lab notebook with structured templates</div>
                        </div>
                        <div style={{
                          background: CANVAS, border: `1px solid ${DIVIDER}`,
                          borderRadius: 4, height: 60, padding: 6,
                          display: 'flex', flexDirection: 'column', gap: 3,
                        }}>
                          <div style={{ height: 6, background: ROYAL_BLUE, borderRadius: 1, opacity: 0.8, width: '60%' }} />
                          <div style={{ height: 4, background: DIVIDER, borderRadius: 1 }} />
                          <div style={{ height: 4, background: DIVIDER, borderRadius: 1, width: '80%' }} />
                          <div style={{ height: 4, background: DIVIDER, borderRadius: 1, width: '40%' }} />
                        </div>
                      </div>
                    }
                    dontNode={
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, maxWidth: 280 }}>
                        {['edit_note', 'inventory_2', 'auto_awesome'].map((i) => (
                          <div key={i} style={{
                            background: '#fff', border: `1px solid ${FOG}`,
                            borderRadius: 6, padding: 10, textAlign: 'center',
                          }}>
                            <div style={{
                              width: 24, height: 24, borderRadius: 6, background: MIST,
                              display: 'flex', alignItems: 'center', justifyContent: 'center',
                              color: ROYAL_BLUE, margin: '0 auto 6px',
                            }}>
                              <MI name={i} size={14} />
                            </div>
                            <div style={{ fontSize: 9, fontWeight: 500, color: SLATE }}>Capability</div>
                            <div style={{ fontSize: 8, color: TEXT_MUTED, marginTop: 2, lineHeight: 1.3 }}>
                              Description text
                            </div>
                          </div>
                        ))}
                      </div>
                    }
                  />

                </div>
              </SGSection>

              {/* COPY & VOICE */}
              <SGSection
                id="voice"
                title="Copy & Voice"
                lead="The system's voice is calm authority, declarative, evidence-led. Copy rules below are enforceable; the worked examples are the canonical labels and microcopy that should propagate across surfaces."
              >
                <h3 style={{ fontSize: 13, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,69,84,0.6)', margin: '0 0 14px' }}>
                  Rules
                </h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 36 }}>
                  {[
                    { rule: 'Sentence case for button labels.',         dont: '"Sign-up"',          doc: '"Sign up"' },
                    { rule: 'No em dashes. Also not double-hyphens.',    dont: 'analysis — fast',   doc: 'analysis is fast' },
                    { rule: 'Verbs first for actions.',                  dont: '"Demo Request"',    doc: '"Request a Demo"' },
                    { rule: 'No marketing adverbs.',                    dont: '"easily ship UI"',   doc: '"ship UI"' },
                    { rule: 'Real numbers over qualifiers.',            dont: '"industry-leading"', doc: '"4.8/5 G2"' },
                    { rule: '"Request a Demo" is the canonical CTA.',    dont: '"Schedule a demo"', doc: '"Request a Demo"' },
                  ].map((r, i) => (
                    <div key={i} className="uc-voice-rule" style={{
                      display: 'grid', gridTemplateColumns: '1fr 220px 220px',
                      gap: 16, alignItems: 'center',
                      padding: '12px 16px',
                      background: '#fff',
                      border: `1px solid ${FOG}`,
                      borderRadius: 6,
                    }}>
                      <div style={{ fontSize: 13, color: SLATE, lineHeight: 1.5 }}>{r.rule}</div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <MI name="close" size={14} fill={1} style={{ color: STATUS_RED }} />
                        <code style={{
                          fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
                          fontSize: 12, color: STATUS_RED, background: STATUS_RED_BG,
                          padding: '2px 7px', borderRadius: 3,
                        }}>{r.dont}</code>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <MI name="check" size={14} fill={1} style={{ color: EMERALD }} />
                        <code style={{
                          fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
                          fontSize: 12, color: EMERALD, background: STATUS_GREEN_BG,
                          padding: '2px 7px', borderRadius: 3,
                        }}>{r.doc}</code>
                      </div>
                    </div>
                  ))}
                </div>

                <h3 style={{ fontSize: 13, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,69,84,0.6)', margin: '0 0 14px' }}>
                  Canonical button labels
                </h3>
                <div style={{
                  display: 'grid',
                  gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))',
                  gap: 12,
                  marginBottom: 36,
                }}>
                  {[
                    { label: 'Request a Demo',   note: 'Brand-affordance casing; the only CTA that converts on this surface.' },
                    { label: 'Watch 2-min tour', note: 'Specific length sets expectation; lowercase after the verb.' },
                    { label: 'Learn more',       note: 'Pairs with a trailing arrow only; never standalone.' },
                    { label: 'View all',         note: 'Use only when "all" is bounded; otherwise be specific.' },
                    { label: 'Open app',         note: 'Authenticated state replacement for "Log in"; verb-first.' },
                    { label: 'Cancel',           note: 'Single word; never "Cancel and exit" or "Discard".' },
                  ].map((b) => (
                    <div key={b.label} style={{
                      background: '#fff',
                      border: `1px solid ${FOG}`,
                      borderRadius: 8,
                      padding: 14,
                    }}>
                      <code style={{
                        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
                        fontSize: 13, color: ROYAL_BLUE, fontWeight: 500,
                        background: MIST,
                        padding: '4px 8px',
                        borderRadius: 3,
                        display: 'inline-block',
                        marginBottom: 8,
                      }}>{b.label}</code>
                      <div style={{ fontSize: 12, color: 'rgba(60,69,84,0.7)', lineHeight: 1.5 }}>
                        {b.note}
                      </div>
                    </div>
                  ))}
                </div>

                <h3 style={{ fontSize: 13, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,69,84,0.6)', margin: '0 0 14px' }}>
                  Error and empty states
                </h3>
                <div style={{
                  display: 'grid',
                  gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))',
                  gap: 16,
                }}>
                  {/* Form error */}
                  <div style={{
                    background: '#fff', border: `1px solid ${FOG}`, borderRadius: 8,
                    padding: 18, display: 'flex', flexDirection: 'column', gap: 10,
                  }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: ROYAL_BLUE, textTransform: 'uppercase', letterSpacing: '.08em' }}>
                      Form error
                    </div>
                    <div style={{
                      background: STATUS_RED_BG, color: STATUS_RED,
                      borderRadius: 4, padding: '8px 12px',
                      fontSize: 13, fontWeight: 500,
                      display: 'flex', alignItems: 'center', gap: 8,
                    }}>
                      <MI name="error" size={16} fill={1} />
                      Email already in use. Try logging in.
                    </div>
                    <div style={{ fontSize: 12, color: 'rgba(60,69,84,0.65)', lineHeight: 1.5 }}>
                      State the problem, then offer the next action. Never "An error occurred" or "Please try again later."
                    </div>
                  </div>

                  {/* Empty resource list */}
                  <div style={{
                    background: '#fff', border: `1px solid ${FOG}`, borderRadius: 8,
                    padding: 18, display: 'flex', flexDirection: 'column', gap: 10,
                  }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: ROYAL_BLUE, textTransform: 'uppercase', letterSpacing: '.08em' }}>
                      Empty list
                    </div>
                    <div style={{
                      background: CANVAS, borderRadius: 4, padding: '14px',
                      display: 'flex', flexDirection: 'column', gap: 6, alignItems: 'flex-start',
                    }}>
                      <div style={{ fontSize: 13, fontWeight: 500, color: SLATE }}>No experiments yet.</div>
                      <div style={{ fontSize: 12, color: 'rgba(60,69,84,0.65)' }}>Start a notebook entry or import from Excel.</div>
                    </div>
                    <div style={{ fontSize: 12, color: 'rgba(60,69,84,0.65)', lineHeight: 1.5 }}>
                      Name the absent thing, then point to the activation action. Never illustrative-blob mascots.
                    </div>
                  </div>

                  {/* Network error */}
                  <div style={{
                    background: '#fff', border: `1px solid ${FOG}`, borderRadius: 8,
                    padding: 18, display: 'flex', flexDirection: 'column', gap: 10,
                  }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: ROYAL_BLUE, textTransform: 'uppercase', letterSpacing: '.08em' }}>
                      Network error
                    </div>
                    <div style={{
                      background: STATUS_RED_BG, borderRadius: 4, padding: '12px 14px',
                      display: 'flex', flexDirection: 'column', gap: 6,
                    }}>
                      <div style={{
                        fontSize: 13, fontWeight: 500, color: STATUS_RED,
                        display: 'flex', alignItems: 'center', gap: 8,
                      }}>
                        <MI name="cloud_off" size={14} fill={1} />
                        Couldn't reach the server.
                      </div>
                      <button style={{
                        alignSelf: 'flex-start',
                        background: 'transparent',
                        color: STATUS_RED,
                        border: `1px solid ${STATUS_RED}`,
                        padding: '4px 10px', borderRadius: 3,
                        fontSize: 12, fontWeight: 500,
                        cursor: 'pointer',
                      }}>
                        Retry
                      </button>
                    </div>
                    <div style={{ fontSize: 12, color: 'rgba(60,69,84,0.65)', lineHeight: 1.5 }}>
                      Acknowledge the failure, then surface the recovery action inline. Don't bury Retry in a modal.
                    </div>
                  </div>
                </div>
              </SGSection>

              {/* Footer note */}
              <div style={{ padding: '48px 0 80px', fontSize: 13, color: 'rgba(60,69,84,0.6)' }}>
                Generated from the live system. Tokens are mirrored 1:1 with the React constants and CSS variables in this file.
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StyleGuide />);
  </script>
</body>
</html>
